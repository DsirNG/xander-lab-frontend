version: "3.8"

services:
    xander-lab-frontend:
        build:
            context: .
            dockerfile: Dockerfile
            args:
                # Read the Spring Boot service directly during the image build. This
                # avoids relying on public DNS / Cloudflare from the Docker builder.
                SEO_API_BASE: ${SEO_API_BASE:-http://host.docker.internal:30002/api}
                SEO_PRERENDER_REQUIRED: ${SEO_PRERENDER_REQUIRED:-true}
                VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://api.dinqor.cn}
                VITE_REQUEST_TIMEOUT: ${VITE_REQUEST_TIMEOUT:-30000}
                VITE_OSS_DOMAIN: ${VITE_OSS_DOMAIN:-https://food-cinder.oss-cn-beijing.aliyuncs.com}
        container_name: xander-lab-frontend
        restart: unless-stopped
        extra_hosts:
            - "host.docker.internal:host-gateway"
        ports:
            - "30001:30001"
        environment:
            - NODE_ENV=production
        networks:
            - xander-network
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "wget --quiet --tries=1 --spider http://127.0.0.1:30001/ || exit 1",
                ]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 40s
        labels:
            - "com.xander-lab.description=DinQorAI Frontend Application"
            - "com.xander-lab.version=1.0.0"

networks:
    xander-network:
        driver: bridge
